# Pipeline P1 (backend): runs when lambda-functions/ changes in this repo.
# Tests both Lambdas, zips them and deploys the new code to index-photos and search-photos.
version: 0.2

env:
  variables:
    INDEX_FUNCTION: index-photos
    SEARCH_FUNCTION: search-photos

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --quiet boto3 pytest
  pre_build:
    commands:
      - python -m pytest -q lambda-functions/tests
  build:
    commands:
      - (cd lambda-functions/index-photos && zip -qr ../../index-photos.zip .)
      - (cd lambda-functions/search-photos && zip -qr ../../search-photos.zip .)
  post_build:
    commands:
      - aws lambda update-function-code --function-name "$INDEX_FUNCTION" --zip-file fileb://index-photos.zip --publish
      - aws lambda wait function-updated --function-name "$INDEX_FUNCTION"
      - aws lambda update-function-code --function-name "$SEARCH_FUNCTION" --zip-file fileb://search-photos.zip --publish
      - aws lambda wait function-updated --function-name "$SEARCH_FUNCTION"
      - echo "Both Lambda functions deployed"

artifacts:
  files:
    - index-photos.zip
    - search-photos.zip
